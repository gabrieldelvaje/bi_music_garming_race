name: Daily listening and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly retries; only the first successful run of each day creates records.
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: music-farming-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Generate missing daily listening (America/Sao_Paulo)
        id: daily
        if: github.event_name != 'push'
        run: npm run update
      - name: Persist the history before publishing
        if: steps.daily.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily listening history"
            git push origin HEAD:main
          fi
      - run: npm run build
        if: github.event_name != 'schedule' || steps.daily.outputs.changed == 'true'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.daily.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.daily.outputs.changed == 'true'
        with:
          path: dist
      - name: Publish
        if: github.event_name != 'schedule' || steps.daily.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
